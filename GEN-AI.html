function Tag({color,children,small}){
  const r=rgb(color);
  return React.createElement('span',{style:{background:`rgba(${r},0.1)`,color,border:`1px solid rgba(${r},0.25)`,padding:small?"2px 8px":"3px 11px",borderRadius:20,fontSize:11,fontWeight:600}},children);
}

      React.createElement('div',{style:{flex:1,minWidth:0}},
        React.createElement('div',{style:{fontSize:11,fontWeight:700,color:color,textTransform:"uppercase",letterSpacing:0.8,marginBottom:3}},"Day "+d.day+" · "+d.tag),
        React.createElement('div',{style:{fontSize:15,fontWeight:700,color:"#E2E8F0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},d.title)
      ),
      React.createElement('div',{style:{display:"flex",alignItems:"center",gap:10,flexShrink:0}},
        React.createElement('span',{style:{fontSize:11,color:"#475569"}},"3 hrs"),
        React.createElement('button',{
          onClick:e=>{e.stopPropagation();toggleDone(d.day);},

      React.createElement('div',{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:20}},
        React.createElement('div',null,

        React.createElement('div',null,
          React.createElement('p',{style:{fontSize:11,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:1,marginBottom:10}},"Free YouTube Resources"),

function AIPanel({aiDay,msgs,loading,inp,setInp,send,closeAI,msgsEndRef,inputRef}){
  if(!aiDay)return null;
  const color=ACC[aiDay.day-1]||"#6366F1";
  const r=rgb(color);
  return React.createElement('div',{style:{position:"fixed",bottom:16,right:16,width:360,height:480,background:"#0D0C2B",border:"1px solid rgba(99,102,241,0.25)",borderRadius:16,boxShadow:"0 20px 60px rgba(0,0,0,0.7)",display:"flex",flexDirection:"column",zIndex:999,overflow:"hidden"}},
    React.createElement('div',{style:{padding:"12px 14px",background:`rgba(${r},0.08)`,borderBottom:"1px solid rgba(99,102,241,0.18)",display:"flex",justifyContent:"space-between",alignItems:"center"}},
      React.createElement('div',null,
        React.createElement('div',{style:{fontSize:13,fontWeight:700,color:"#E2E8F0"}},"🤖 AI Tutor"),
        React.createElement('div',{style:{fontSize:11,color:"#94A3B8"}},"Day "+aiDay.day+": "+aiDay.title)
      ),
      React.createElement('button',{onClick:closeAI,style:{background:"none",border:"none",color:"#94A3B8",fontSize:22,padding:"0 4px",lineHeight:1}},"\u00d7")
    ),
    React.createElement('div',{className:"scrollbar",style:{flex:1,overflowY:"auto",padding:12,display:"flex",flexDirection:"column",gap:8}},
      msgs.map((m,i)=>React.createElement('div',{key:i,style:{maxWidth:"88%",alignSelf:m.role==="user"?"flex-end":"flex-start",background:m.role==="user"?"#6366F1":"#12113A",borderRadius:m.role==="user"?"12px 12px 2px 12px":"12px 12px 12px 2px",padding:"9px 13px",fontSize:13,color:"#E2E8F0",lineHeight:1.6,whiteSpace:"pre-wrap",wordBreak:"break-word"}},m.text)),
      loading&&React.createElement('div',{style:{alignSelf:"flex-start",background:"#12113A",borderRadius:"12px 12px 12px 2px",padding:"9px 13px",fontSize:13,color:"#94A3B8"}},"Thinking…"),
      React.createElement('div',{ref:msgsEndRef})
    ),
    React.createElement('div',{style:{padding:10,borderTop:"1px solid rgba(99,102,241,0.18)",display:"flex",gap:8}},
      React.createElement('input',{ref:inputRef,value:inp,onChange:e=>setInp(e.target.value),onKeyDown:e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}},placeholder:"Ask a question…",style:{flex:1,background:"#12113A",border:"1px solid rgba(99,102,241,0.18)",borderRadius:8,padding:"8px 12px",color:"#E2E8F0",fontSize:13,outline:"none"}}),
      React.createElement('button',{onClick:send,disabled:loading||!inp.trim(),style:{background:"#6366F1",border:"none",borderRadius:8,padding:"0 14px",color:"#fff",fontSize:16,opacity:loading||!inp.trim()?0.45:1,transition:"opacity 0.2s"}},"→")
    )
  );
}

function App(){
  const [tab,setTab]=useState("overview");
  const [expanded,setExpanded]=useState(null);
  const [done,setDone]=useState(new Set());
  const [aiOpen,setAiOpen]=useState(false);
  const [aiDay,setAiDay]=useState(null);
  const [msgs,setMsgs]=useState([]);
  const [hist,setHist]=useState([]);
  const [inp,setInp]=useState("");
  const [loading,setLoading]=useState(false);
  const msgsEndRef=useRef(null);
  const inputRef=useRef(null);

  useEffect(()=>{msgsEndRef.current?.scrollIntoView({behavior:"smooth"});},[msgs,loading]);

  const toggleDay=n=>setExpanded(e=>e===n?null:n);
  const toggleDone=n=>setDone(prev=>{const s=new Set(prev);s.has(n)?s.delete(n):s.add(n);return s;});

  const openAI=d=>{
    setAiDay(d);setHist([]);
    setMsgs([{role:"assistant",text:"Hi! I'm your AI Tutor for Day "+d.day+": "+d.title+" 🎓\n\nI can explain "+d.chips.slice(0,3).join(", ")+" and much more.\n\nWhat would you like to understand?"}]);
    setAiOpen(true);
    setTimeout(()=>inputRef.current?.focus(),150);
  };

  const openGeneral=()=>{
    setAiDay({day:"—",title:"Python & GenAI Bootcamp",chips:["Python","AI","LLMs","Streamlit","LangChain","RAG","Agents"],outcomes:[]});
    setHist([]);
    setMsgs([{role:"assistant",text:"Hi! I'm your AI Tutor for the full Python & Generative AI Bootcamp 🎓\n\nAsk me anything from Days 1–10. What would you like to learn?"}]);
    setAiOpen(true);
    setTimeout(()=>inputRef.current?.focus(),150);
  };

  const send=async()=>{
    const q=inp.trim();
    if(!q||loading||!aiDay)return;
    setInp("");
    setMsgs(prev=>[...prev,{role:"user",text:q}]);
    const newHist=[...hist,{role:"user",content:q}];
    setHist(newHist);setLoading(true);
    try{
      const sys=aiDay.day==="—"
